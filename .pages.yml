media: media

content:
  - name: news
    label: News Articles
    type: collection
    path: content/news

    fields:
      - name: title
        label: Title
        type: string

      - name: slug
        label: Slug
        type: string

      - name: publishDate
        label: Publish Date
        type: date

      - name: summary
        label: Summary
        type: text

      - name: featuredImage
        label: Featured Image
        type: image

      - name: category
        label: Category
        type: string

      - name: featured
        label: Featured
        type: boolean

      - name: body
        label: Article Content
        type: rich-text
        options:
          format: html